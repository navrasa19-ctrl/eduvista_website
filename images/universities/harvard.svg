<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="260" height="85">
  <!-- Harvard Crimson Shield -->
  <g transform="translate(12, 8)">
    <path d="M 0,0 L 60,0 Q 64,0 64,5 L 64,48 Q 64,80 32,86 Q 0,80 0,48 L 0,5 Q 0,0 4,0 Z" fill="#A51C30"/>
    <!-- Three Open Books (VE - RI - TAS) -->
    <!-- Book 1 -->
    <rect x="10" y="14" width="18" height="15" rx="2" fill="#ffffff"/>
    <text x="19" y="25" fill="#A51C30" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" text-anchor="middle">VE</text>
    <!-- Book 2 -->
    <rect x="36" y="14" width="18" height="15" rx="2" fill="#ffffff"/>
    <text x="45" y="25" fill="#A51C30" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" text-anchor="middle">RI</text>
    <!-- Book 3 -->
    <rect x="23" y="44" width="18" height="15" rx="2" fill="#ffffff"/>
    <text x="32" y="55" fill="#A51C30" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" text-anchor="middle">TAS</text>
  </g>
  <!-- Text -->
  <text x="90" y="44" fill="#A51C30" font-family="'Times New Roman', Georgia, serif" font-size="22" font-weight="bold" letter-spacing="1">HARVARD</text>
  <text x="90" y="68" fill="#2d3748" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="bold" letter-spacing="1.5">UNIVERSITY</text>
</svg>