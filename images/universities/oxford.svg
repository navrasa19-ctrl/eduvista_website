<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="260" height="85">
  <!-- Oxford Roundel Shield -->
  <g transform="translate(10, 8)">
    <circle cx="42" cy="42" r="40" fill="#002147"/>
    <circle cx="42" cy="42" r="35" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Three Gold Crowns -->
    <path d="M 28,26 L 31,34 L 38,34 L 41,26 L 36,29 L 34.5,24 L 33,29 Z" fill="#E8B923"/>
    <path d="M 46,26 L 49,34 L 56,34 L 59,26 L 54,29 L 52.5,24 L 51,29 Z" fill="#E8B923"/>
    <path d="M 37,56 L 40,64 L 47,64 L 50,56 L 45,59 L 43.5,54 L 42,59 Z" fill="#E8B923"/>
    <!-- Open Book -->
    <path d="M 30,38 Q 42,35 42,48 Q 42,35 54,38 L 54,50 Q 42,47 42,56 Q 42,47 30,50 Z" fill="#ffffff"/>
    <text x="42" y="46" fill="#002147" font-family="'Times New Roman', serif" font-size="5" font-weight="bold" text-anchor="middle">DOMI MINA</text>
  </g>
  <!-- Text -->
  <text x="100" y="44" fill="#002147" font-family="'Times New Roman', Georgia, serif" font-size="18" font-weight="bold" letter-spacing="1">UNIVERSITY OF</text>
  <text x="100" y="70" fill="#002147" font-family="'Times New Roman', Georgia, serif" font-size="24" font-weight="bold" letter-spacing="1.5">OXFORD</text>
</svg>