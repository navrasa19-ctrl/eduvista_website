    <circle cx="30" cy="30" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="30" y1="6" x2="30" y2="54" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="6" y1="30" x2="54" y2="30" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
